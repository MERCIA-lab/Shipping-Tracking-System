version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: imeek-postgres
    environment:
      POSTGRES_USER: imeek
      POSTGRES_PASSWORD: imeek_dev_password
      POSTGRES_DB: imeek_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: imeek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: imeek-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: imeek-api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://imeek:imeek_dev_password@postgres:5432/imeek_platform
      REDIS_URL: redis://redis:6379

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
