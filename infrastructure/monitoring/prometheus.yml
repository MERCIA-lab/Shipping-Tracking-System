global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'imeek-api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'

  - job_name: 'imeek-services'
    static_configs:
      - targets:
        - 'auth-service:3001'
        - 'product-service:3002'
        - 'order-service:3003'
        - 'payment-service:3004'
    metrics_path: '/metrics'
